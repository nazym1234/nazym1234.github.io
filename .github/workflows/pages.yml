name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout Asteroids source
        uses: actions/checkout@v4
        with:
          repository: nazym1234/asteroids-game
          ref: ad1dfcd6a2a19b4acbe0d0bea77f01b088db4cf3
          path: _game
      - name: Prepare browser build
        env:
          RUSTFLAGS: "-C link-arg=--import-undefined"
        run: |
          python3 scripts/prepare-game.py
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path _game/Cargo.toml --release --target wasm32-unknown-unknown
      - name: Checkout Flappy OCaml source
        uses: actions/checkout@v4
        with:
          repository: nazym1234/flappy-bird-en-ocaml
          ref: 4e071e40e8257885bfcacc326d0cb5a0139cef88
          path: _flappy
      - name: Build Flappy OCaml for browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ocaml ocaml-findlib js-of-ocaml libjs-of-ocaml-dev
          python3 scripts/prepare-flappy.py
          cd flappy
          ocamlfind ocamlc -package js_of_ocaml -linkpkg engine.ml flappybird.ml -o game.byte
          js_of_ocaml game.byte -o game.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html merci.html style.css app.js .nojekyll _site/
          cp -R assets asteroids _site/
          mkdir -p _site/flappy
          cp flappy/index.html flappy/page.css flappy/page.js flappy/game.js _site/flappy/
          cp _game/target/wasm32-unknown-unknown/release/asteroid.wasm _site/asteroids/
          cp -R _game/notreimage _game/musique _site/asteroids/
      - name: Test browser game
        run: |
          npm install --prefix /tmp/asteroids-test playwright@1.58.2
          /tmp/asteroids-test/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8000 --directory _site > /tmp/asteroids-server.log 2>&1 &
          NODE_PATH=/tmp/asteroids-test/node_modules node scripts/test-game.cjs
          NODE_PATH=/tmp/asteroids-test/node_modules node scripts/test-flappy.cjs
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
